name: 'Install Dependencies'
description: 'Installs necessary dependencies like fontconfig and ninja.'
runs:
  using: 'composite' # Allows for multiple `steps`
  steps:
    - name: Install Zig
      # Required to build wasmz-sys (libwasmz static library).
      uses: goto-bus-stop/setup-zig@v2
      with:
        version: 0.16.0
    - name: Install Dependencies (Linux)
      if: runner.os == 'Linux'
      # - libfontconfig1-dev: required for plotters
      # - ninja-build: required for Wasmer's WAMR backend
      # - cmake: required to build the WAMR runtime (rt-wamr) from source
      # - clang / libclang-dev: required by bindgen when building toywasmx-sys (rt-toywasm)
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libfontconfig1-dev ninja-build cmake clang libclang-dev
    # A C compiler with `musttail` support is required for Wasm3's own Wasm tail-call support.
    - name: Install GCC 15 (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        if ! sudo apt-get install -y gcc-15 g++-15; then
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-15 g++-15
        fi
        gcc-15 --version
        echo "CC=gcc-15" >> "$GITHUB_ENV"
        echo "CXX=g++-15" >> "$GITHUB_ENV"
    - name: Install Dependencies (macOS)
      if: runner.os == 'macOS'
      # ninja: required for Wasmer's WAMR backend; cmake: required to build rt-wamr.
      # clang/libclang ship with the Xcode command-line tools.
      shell: bash
      run: brew install ninja cmake
    - name: Install Dependencies (Windows)
      if: runner.os == 'Windows'
      # ninja: required for Wasmer's WAMR backend.
      # cmake and LLVM (libclang for bindgen) are preinstalled on the runner.
      shell: bash
      run: choco install ninja
